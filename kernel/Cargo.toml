[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bit_field = "0.10.3"
bitflags = "2.9.4"
elf = { version = "0.8.0", default-features = false }
good_memory_allocator = "0.1.7"
spin = "0.10.0"
thiserror = { version = "2.0.16", default-features = false }
time = { version = "0.3.44", default-features = false }
ostd = { workspace = true }
component = { workspace = true }
log = { workspace = true }
pci = { path = "comps/pci" }
terminal = { path = "comps/terminal" }
logger = { version = "0.1.0", path = "comps/logger" }
block = { version = "0.1.0", path = "comps/block" }
ahci = { version = "0.1.0", path = "comps/ahci" }
nvme = { version = "0.1.0", path = "comps/nvme" }
lwext4_rust = { git = "https://github.com/elliott10/lwext4_rust", version = "0.2.0" }
ramdisk = { version = "0.1.0", path = "comps/ramdisk" }
fatfs = { git = "https://github.com/rafalh/rust-fatfs", version = "0.4.0", default-features = false, features = ["lfn", "alloc", "log_level_trace"] }
gpt_disk_io = { version = "0.16.2", features = ["alloc"] }
network = { version = "0.1.0", path = "comps/network" }
