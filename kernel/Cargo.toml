[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
zodiac = { workspace = true, features = ["default_allocator"] }
log = "0.4.27"
good_memory_allocator = "0.1.7"
spin = "0.10.0"
os-terminal = { version = "0.6.10", features = ["truetype"] }
thiserror = { version = "2.0.12", default-features = false }
bitflags = "2.9.1"
x86_64 = "0.15.2"
smoltcp = { version = "0.12.0", default-features = false, features = ["alloc", "log", "proto-ipv4", "proto-dhcpv4", "medium-ethernet", "socket-icmp", "socket-udp", "socket-tcp", "socket-raw", "socket-dhcpv4"] }
bit_field = "0.10.3"
volatile = "0.6.1"
time = { version = "0.3.43", default-features = false }

