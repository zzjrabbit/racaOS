[package]
name = "zodiac"
version = "0.1.0"
edition = "2024"
authors = ["Zhenjia Zeng"]
description = "Rust OS framework that offers safe interfaces for kernel development"
keywords = ["kernel", "os", "no_std"]
categories = ["no-std"]
license = "Apache-2.0"
homepage = "https://github.com/zzjrabbit/racaOS/tree/edition19/zodiac"
repository = "https://github.com/zzjrabbit/racaOS"

[dependencies]
zodiac_macro = { version = "0.1.0", path = "../zodiac_macro" }
bit_field = "0.10.2"
bitflags = "2.9.1"
humansize = "2.1.3"
limine = "0.5.0"
log = "0.4.27"
spin = "0.10.0"
thiserror = { version = "2.0.12", default-features = false }
uart_16550 = "0.3.2"
good_memory_allocator = { version = "0.1.7", optional = true }
derive_more = { version = "2.0.1", default-features = false, features = ["full"] }
pastey = "0.1.0"

[dependencies.object]
version = "0.37.1"
features = ["read_core", "elf", "pe", "unaligned"]
default-features = false

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.2"
x2apic = "0.5.0"
aml = "0.16.4"
acpi = "5.2.0"

[features]
default = []
default_allocator = ["dep:good_memory_allocator"]
