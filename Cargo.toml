[workspace]
members = ["builder", "init", "loongarch64", "modules/*", "crates/*", "zodiac", "zodiac_macro"]
default-members = ["builder"]
resolver = "3"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"

[workspace.dependencies]
mostd = { path = "./crates/mostd" }
zodiac = { path = "./zodiac" }
errors = { path = "./modules/errors" }
log = "0.4.28"
