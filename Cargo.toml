[workspace]
resolver = "2"
members = ["zodiac", "zodiac_macro", "kernel", "apps/hello", "simple_muqss", "zoo"]

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"

[profile.release-lto]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1

[workspace.dependencies]
zodiac = { path = "zodiac" }
simple_muqss = { path = "simple_muqss" }
